plugins {
    id "java-library"
    id "maven-publish"
    id "idea"
    id "net.neoforged.moddev" version "2.0.140"
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
    maven { // Curios
        name = "Illusive Soulworks"
        url = "https://maven.theillusivec4.top/"
    }
    maven { // JEI
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        name = "Figura"
        url = "https://maven.figuramc.org/releases"
    }
    maven {
        name = "JitPack"
        url = "https://jitpack.io"
    }
}

dependencies {
    // Curios
    compileOnly "top.theillusivec4.curios:curios-neoforge:$curios_version+$minecraft_version"
    compileOnly "top.theillusivec4.curios:curios-neoforge:$curios_version+$minecraft_version:api"
    if(curios_enabled) runtimeOnly("top.theillusivec4.curios:curios-neoforge:$curios_version+$minecraft_version")

    // JEI
    compileOnly "mezz.jei:jei-$minecraft_version-neoforge-api:$jei_version"
    if(jei_enabled) runtimeOnly "mezz.jei:jei-$minecraft_version-neoforge:$jei_version"

    // Figura
    compileOnly "org.figuramc:figura-neoforge:$figura_version+$minecraft_version"
    implementation "com.github.FiguraMC.luaj:luaj-core:$luaj_version-figura"
    implementation "com.github.FiguraMC.luaj:luaj-jse:$luaj_version-figura"
    implementation "com.neovisionaries:nv-websocket-client:$nv_websocket_version"

    if(figura_enabled) runtimeOnly "org.figuramc:figura-neoforge:$figura_version+$minecraft_version"
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version
    accessTransformers = files("src/main/resources/META-INF/accesstransformer.cfg")

    runs {
        client {
            client()

            systemProperty "neoforge.enabledGameTestNamespaces", project.mod_id
        }

        clientAuth {
            client()

            devLogin = true
        }

        secondClient {
            client()

            systemProperty "neoforge.enabledGameTestNamespaces", project.mod_id
            programArguments.addAll "--username", "Dov"
        }

        server {
            server()
            programArgument "--nogui"
            systemProperty "neoforge.enabledGameTestNamespaces", project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty "neoforge.enabledGameTestNamespaces", project.mod_id
        }

        data {
            data()

            programArguments.addAll "--mod", project.mod_id, "--all", "--output", file("src/generated/resources/").getAbsolutePath(), "--existing", file("src/main/resources/").getAbsolutePath()
        }

        configureEach {
            systemProperty "forge.logging.markers", "REGISTRIES"

            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir "src/generated/resources" }

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version: minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version: neo_version,
            neo_version_range: neo_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_description: mod_description,
            curios_version_range: curios_version_range
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register("mavenJava", MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
